version: "3.8"
services:
  db:
    image: postgres:15
    container_name: heyhost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "heyhost"
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heyhost"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/heyhost?schema=public"
      PORT: "4000"
    command: sh -c "npx prisma db push --accept-data-loss && node dist/index.js"
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  db-data:
